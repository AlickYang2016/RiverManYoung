# Publishes the site to GitHub Pages on every push to folio-test, the only branch the github-pages environment lets deploy
# (main is kept identical to it). Pages must be set to deploy from GitHub Actions (Settings > Pages > Source); until then the run
# stops early with a note saying so.
name: Pages

on:
  push:
    branches: [folio-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not set to deploy from Actions. Settings → Pages → Source: GitHub Actions, then run this workflow again."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.on == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Folio: cut the CJK faces to the characters the profiles print (scripts/subset-fonts.py), so a new word never falls back
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.66.1 brotli && python scripts/subset-fonts.py
      # catches a profile that does not match the schema before it reaches the site
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
