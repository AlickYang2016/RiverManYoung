# Has Claude review every pull request when it is opened, gets new commits, or is marked ready for review.
# Needs one repository secret (Settings > Secrets and variables > Actions): ANTHROPIC_API_KEY, or CLAUDE_CODE_OAUTH_TOKEN
# from `claude setup-token` for a Claude subscription. The Claude GitHub App must also be installed on the repository.
# Pull requests from forks get no secrets, so the run is skipped for them.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CONTRIBUTING.md first for the project's rules
            (Bun toolchain, typecheck and tests kept green, demo profile in profile/ left as is,
            no third-party models or textures).

            Focus on, in order:
            - correctness bugs and regressions
            - security issues
            - breaking the CONTRIBUTING.md rules above
            - clear simplifications or performance problems

            Put each concrete finding as an inline comment on the line it is about.
            Then post one short summary comment on the PR. If nothing is wrong, say so briefly.
            Do not comment on style or formatting alone.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
